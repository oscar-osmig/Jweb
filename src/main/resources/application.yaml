# =============================================================================
# Application Configuration
# =============================================================================
# Your app-specific settings. Framework settings are in jweb.yaml.
# =============================================================================

server:
  port: ${PORT:8085}

spring:
  application:
    name: MyApp
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

logging:
  level:
    org.mongodb.driver: WARN

jweb:
  admin:
    # Credentials come from the environment ONLY — never commit them.
    # A blank token disables admin login entirely.
    #
    #   export JWEB_ADMIN_TOKEN="$(openssl rand -hex 16)"
    #   export JWEB_ADMIN_EMAIL="you@example.com"
    #   ./mvnw spring-boot:run
    #
    # Then log in at /only-admin/log/in.
    token: ${JWEB_ADMIN_TOKEN:}
    email: ${JWEB_ADMIN_EMAIL:}

  ai:
    # Built-in AI module (framework/ai) — works with any OpenAI-compatible API.
    # OpenAI:  base-url: https://api.openai.com/v1   model: gpt-4o-mini
    # Ollama:  base-url: http://localhost:11434/v1   model: llama3.2  (no api-key)
    enabled: false
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}

  markitdown:
    # Path to the markitdown CLI (project-local venv by default)
    command: ${MARKITDOWN_CMD:.tools/markitdown/bin/markitdown}
    timeout-seconds: 120

  data:
    enabled: true
    mongo:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      database: ${MONGO_DB:myapp}
